name: CIVION Mobile — build

# One build procedure, two callers. This workflow does not build anything itself:
# it calls app-civion/tools/build-civion-mobile.ps1, the same script the owner runs
# by hand. Commit identity, the engine-footprint check and the SHA-256 ledger all
# live in that script, so a CI artifact and a hand-built artifact are equivalent.
#
# Runs on a self-hosted Windows runner: the machine already carries JDK 21 and the
# Android SDK, and self-hosted runners consume no GitHub Actions minutes.

# Only `push` builds. In a single-owner repository a pull request from a branch
# of the same repository would build the identical commit a second time on the
# one available runner.
on:
  push:
    branches:
      - 'civion/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

# One runner, one build at a time. The group deliberately does not include the
# ref: two branches carrying the same commit would otherwise build concurrently
# and collide in the runner's single workspace.
concurrency:
  group: civion-mobile-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build-civion-mobile.ps1
    runs-on: [self-hosted, windows]
    timeout-minutes: 90

    steps:
      # fetch-depth: 0 so the script can measure the footprint against the
      # upstream base commit; a shallow checkout silently skips that check.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The FAST tier of the acceptance contract: everything that can be checked in
      # minutes without a mail server, a device or a person. The rest of that tier is
      # the artifact gates, which run inside the build steps below because they need
      # the built APK.
      #
      # Ahead of the build on purpose. A failure here is a failure of the product's
      # behaviour, and spending four minutes assembling an APK to be told so afterwards
      # helps nobody.
      - name: Acceptance (FAST tier)
        # Same process-scoped bypass as the build steps, and for the same reason: the
        # runner service executes under NETWORK SERVICE, whose execution policy would
        # otherwise refuse the generated script outright - a step that fails in under a
        # second, before anything it was meant to check has run.
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $env:JAVA_HOME = "F:\Android\jdk-21"
          $env:ANDROID_HOME = "F:\Android\Sdk"
          $env:ANDROID_SDK_ROOT = "F:\Android\Sdk"
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          $tasks = @(
            ":feature:civion:acceptance:test"
            ":feature:civion:core:test"
            ":feature:civion:adapter:testDebugUnitTest"
            ":feature:civion:navigation:testDebugUnitTest"
            ":feature:civion:integration:impl:testDebugUnitTest"
            ":feature:civion:integration:noop:testDebugUnitTest"
            ":app-civion:testStandaloneDebugUnitTest"
            ":app-civion:testIntegratedDebugUnitTest"
          ) -join " "
          $cmd = '"{0}" {1} --no-daemon --no-watch-fs' -f (Join-Path $PWD "gradlew.bat"), $tasks
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        env:
          # Repository variables, not secrets: an Android OAuth client id is public by
          # construction — the client is bound to package name and signing certificate.
          CIVION_OAUTH_CLIENT_ID_DEBUG: ${{ vars.CIVION_OAUTH_CLIENT_ID_DEBUG }}
          CIVION_DEBUG_KEYSTORE: ${{ vars.CIVION_DEBUG_KEYSTORE }}
          # Where artifacts land on this machine. A repository variable, not a path
          # written into the source: the workspace can move without a commit. Unset
          # means the script writes to a repository-relative out\.
          CIVION_OUT_DIR: ${{ vars.CIVION_OUT_DIR }}
        # The runner service executes under NETWORK SERVICE. Use a process-scoped
        # bypass so the trusted repository script can run regardless of that
        # service account's PowerShell execution policy; machine policy is unchanged.
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          .\app-civion\tools\build-civion-mobile.ps1 `
            -Variant "${{ inputs.variant || 'debug' }}" `
            -Edition standalone

      # The integrated edition is built too, and its own gate checked, because the
      # separation is only proven when both sides are: a standalone artifact free of
      # integration code says nothing if the integrated one has none either. The extra
      # cost is small - the two editions differ by one module, and everything else is
      # already built and up to date by the time this runs.
      #
      # Its APK is deliberately not uploaded. There is no CIVION Core protocol yet, so
      # it is build evidence rather than something anyone should install.
      - name: Build (integrated edition, boundary check only)
        id: build-integrated
        env:
          CIVION_OAUTH_CLIENT_ID_DEBUG: ${{ vars.CIVION_OAUTH_CLIENT_ID_DEBUG }}
          CIVION_DEBUG_KEYSTORE: ${{ vars.CIVION_DEBUG_KEYSTORE }}
          CIVION_OUT_DIR: ${{ vars.CIVION_OUT_DIR }}
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          .\app-civion\tools\build-civion-mobile.ps1 `
            -Variant "${{ inputs.variant || 'debug' }}" `
            -Edition integrated `
            -NoClean

      # Every build, CI or manual, lands in the directory the script resolved and
      # reported as its `outdir` output. The workflow artifact is a copy for anyone
      # without access to the machine.
      - name: Upload APK, hash and build info
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: civion-mobile-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.outdir }}\${{ steps.build.outputs.artifact }}
            ${{ steps.build.outputs.outdir }}\${{ steps.build.outputs.info }}
            ${{ steps.build.outputs.outdir }}\${{ steps.build.outputs.log }}
          retention-days: 30
          if-no-files-found: error
