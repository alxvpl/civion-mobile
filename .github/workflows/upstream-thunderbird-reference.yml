name: Upstream Thunderbird — reference build

# Builds upstream app-thunderbird from the same commit, on the same machine, with
# the same toolchain. Its application id differs (net.thunderbird.android.debug),
# so it installs alongside CIVION Mobile and the same account can be compared in
# both. Manual only.

on:
  workflow_dispatch:

concurrency:
  group: civion-mobile-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: app-thunderbird fossDebug
    runs-on: [self-hosted, windows]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        env:
          # Same mechanism as the CIVION Mobile build: the output location is a
          # repository variable, never a path committed to the source. Unset means
          # a repository-relative out\.
          CIVION_OUT_DIR: ${{ vars.CIVION_OUT_DIR }}
        run: |
          $env:JAVA_HOME = "F:\Android\jdk-21"
          $env:ANDROID_HOME = "F:\Android\Sdk"
          $env:ANDROID_SDK_ROOT = "F:\Android\Sdk"
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          $outDir = if ($env:CIVION_OUT_DIR) { $env:CIVION_OUT_DIR } else { "out" }
          if (-not [System.IO.Path]::IsPathRooted($outDir)) { $outDir = Join-Path $PWD $outDir }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outDir = (Resolve-Path $outDir).Path
          $log = Join-Path $outDir "gradle-thunderbird-reference.log"
          $cmd = '"{0}" :app-thunderbird:assembleFossDebug --no-daemon --no-watch-fs > "{1}" 2>&1' -f (Join-Path $PWD "gradlew.bat"), $log
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            exit $LASTEXITCODE
          }
          $apk = Get-ChildItem -Path "app-thunderbird\build\outputs\apk" -Filter *.apk -Recurse -File | Select-Object -First 1
          if (-not $apk) { Write-Error "No APK produced"; exit 1 }
          $target = Join-Path $outDir "Thunderbird-upstream-reference.apk"
          Copy-Item $apk.FullName $target -Force
          Write-Output "APK: $target"
          (Get-FileHash -Algorithm SHA256 $target).Hash
